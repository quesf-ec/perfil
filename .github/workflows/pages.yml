name: Publicar en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Solo lo que sirve el sitio: todo el repo.
      - name: Armar el sitio
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: despliegue
        uses: actions/deploy-pages@v4
